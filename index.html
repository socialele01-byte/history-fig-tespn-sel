<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIG-TESPN 融入社會科 教學包 — 入口網站</title>
<style>
  /* ── FIG-TESPN 教學包・共用設計 token ─────────────────────────────
     8 份檔案共用同一組。所有顏色一律經此宣告，樣式區不再寫死色值。
     命名採語意角色：
       --X        純填色，不承載文字（色條、進度條、圓點、分隔）
       --X-deep   承載文字用：當紙上文字色，或當底色配 --on-accent
                  （對最深淺底 --tint-sand 皆 ≥ 4.5:1）
       --on-accent  置於 -deep／--deep 深填色上的文字（白）
       --on-warm    置於 --amber／--gold 亮填色上的文字（墨）
     ------------------------------------------------------------- */
  /* ── FIG-TESPN 教學包・共用設計 token ─────────────────────────────
     8 份檔案共用同一組。所有顏色一律經此宣告，樣式區不再寫死色值。
     命名採語意角色：
       --X        純填色，不承載文字（色條、進度條、圓點、分隔）
       --X-deep   承載文字用：當紙上文字色，或當底色配 --on-accent
                  （對最深淺底 --tint-sand 皆 ≥ 4.5:1）
       --on-accent  置於 -deep／--deep 深填色上的文字（白）
       --on-warm    置於 --amber／--gold 亮填色上的文字（墨）
     ------------------------------------------------------------- */
  :root{
    /* 字體堆疊 */
    --font-body:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    --font-display:Georgia,"Times New Roman",serif;
    --font-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

    /* 紙張與墨色 */
    --paper:#FBF3E2;
    --paper-hi:#FFFCF4;
    --paper-lo:#FFF6E6;
    --card:#FFFDF8;
    --ink:#3A2A20;
    --ink-soft:#7C6758;
    --line:#EAD9BD;
    --on-accent:#FFFFFF;
    --on-warm:#3A2A20;

    /* 色相・純填色 */
    --coral:#E25B43; --amber:#F0A03B; --gold:#D9A82E; --green:#5FA463;
    --teal:#3F9E8E;  --sky:#3E8CB5;   --deep:#356E9E;  --close:#C9743E;

    /* 色相・承載文字用（--deep 原值已達標，無加深版） */
    --coral-deep:#C5371E; --amber-deep:#9C5C0C;
    --green-deep:#437646; --teal-deep:#2F766A;  --sky-deep:#327193;
    --close-deep:#9F592D;

    /* 淺色調底（皆可承載 --ink 與 --ink-soft） */
    --tint-warm:#FFF7EC;  --tint-sand:#FBEAD0; --tint-cream:#FBF6EC;
    --tint-note:#FBF1DE;  --tint-coral:#FDF0E9; --tint-green:#E5F1E6;
    --tint-teal:#EAF5F2;  --tint-sky:#EEF5F8;   --tint-honey:#FFF7E8;
    --surface-hover:#FFF1D6;
    --surface-input:#FFFEFB;

    /* 邊框與陰影（陰影帶墨色相，不用純黑） */
    --line-coral:#F3C9BC; --line-green:#CFE6D4; --line-sky:#BFDDEC;
    --shadow-soft:rgba(58,42,32,.12);
    --shadow-firm:rgba(58,42,32,.16);

    /* 步驟徽章的淡色底（承載 --ink） */
    --pale-coral:#FBD9CF; --pale-amber:#FCE6C6; --pale-gold:#F6E7B6;
    --pale-green:#D7EBD9; --pale-teal:#CFE9E3;  --pale-sky:#CFE3EF;
    --pale-deep:#D0DCEA;  --pale-close:#F1DBC6;

    /* 抬頭光暈（--amber 22% / --green 16%） */
    --bloom-warm:rgba(240,160,59,.22);
  }

  /* 本檔專用：版面尺寸 */
  :root{ --sidebar-w:280px; }

  /* 配色對：填色與其文字色永遠成對，避免白字落在亮暖色上（對比皆 ≥4.5:1） */
  .sw-coral{background:var(--coral-deep);color:var(--on-accent);}
  .sw-amber{background:var(--amber);     color:var(--on-warm);}
  .sw-gold {background:var(--gold);      color:var(--on-warm);}
  .sw-green{background:var(--green-deep);color:var(--on-accent);}
  .sw-teal {background:var(--teal-deep); color:var(--on-accent);}
  .sw-sky  {background:var(--sky-deep);  color:var(--on-accent);}
  .sw-deep {background:var(--deep);      color:var(--on-accent);}
  .sw-close{background:var(--close-deep);color:var(--on-accent);}

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--paper);color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;}

  .shell{display:flex;height:100vh;}

  /* Sidebar */
  aside{width:var(--sidebar-w);flex:none;background:linear-gradient(180deg,var(--paper-hi),var(--paper-lo));
    border-right:2px solid var(--ink);overflow-y:auto;padding:18px 14px 30px;}
  .brand{padding:4px 6px 14px;border-bottom:2px solid var(--line);margin-bottom:14px;}
  .eyebrow{font-size:.66rem;letter-spacing:.26em;font-weight:700;color:var(--coral-deep);margin:0 0 6px;text-transform:uppercase;}
  .brand h1{margin:0;font-size:1.08rem;font-weight:800;line-height:1.35;}
  .brand small{display:block;font-size:.74rem;font-weight:700;color:var(--ink-soft);margin-top:4px;}

  .grp{margin-top:16px;}
  .grp h2{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:.82rem;font-weight:800;}
  .grp h2 .b{width:1.4rem;height:1.4rem;border-radius:7px;display:grid;place-items:center;
    font-family:var(--font-display);font-weight:700;font-size:.82rem;flex:none;}
  .grp h2 .sub{font-size:.66rem;color:var(--ink-soft);font-weight:600;margin-left:2px;}

  nav.items{display:flex;flex-direction:column;gap:5px;}
  .nitem{display:block;border:2px solid transparent;border-radius:10px;
    padding:8px 10px;font-size:.84rem;font-weight:700;color:var(--ink);
    text-decoration:none;line-height:1.4;}
  .nitem:hover{background:var(--surface-hover);border-color:var(--line);}
  /* 目前檢視中的項目：以 aria-current 驅動樣式，狀態同時傳達給輔助科技 */
  .nitem[aria-current="page"]{background:var(--card);border-color:var(--ink);box-shadow:2px 2px 0 var(--line);}
  /* 鍵盤焦點：沿用骰子／鷹架的既有樣式（--sky 對各淺色底皆 ≥3.3:1） */
  .nitem:focus-visible{outline:3px solid var(--sky);outline-offset:2px;}
  .nitem .num{display:inline-block;width:1.4rem;color:var(--coral-deep);font-family:var(--font-display);}
  .nitem .desc{display:block;font-size:.72rem;font-weight:600;color:var(--ink-soft);margin-top:1px;margin-left:1.4rem;}

  .pptxnote{margin-top:18px;border:2px dashed var(--close);border-radius:11px;background:var(--tint-warm);padding:10px 12px;font-size:.74rem;color:var(--ink-soft);}
  .pptxnote b{color:var(--close-deep);display:block;font-size:.78rem;margin-bottom:3px;}
  .pptxnote a{display:block;color:var(--sky-deep);font-weight:700;text-decoration:none;margin-top:4px;}
  .pptxnote a:hover{text-decoration:underline;}
  .pptxnote a:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:5px;}
  .pptxnote a::before{content:"↗ ";}

  /* Main content */
  main{flex:1;position:relative;overflow:hidden;background:var(--paper);}
  .frame-wrap{position:absolute;inset:0;}
  iframe{width:100%;height:100%;border:none;background:var(--card);}

  .topbar{position:absolute;top:0;left:0;right:0;height:0;}

  @media (max-width:780px){
    :root{--sidebar-w:100%;}
    .shell{flex-direction:column;}
    aside{width:100%;height:auto;max-height:42vh;border-right:none;border-bottom:2px solid var(--ink);}
    main{flex:1;}
  }
</style>
</head>

      <h1>FIG-TESPN 融入社會科<small>社會情緒學習 (SEL) × 五年級社會科</small></h1>

    </div>
  </aside>

  <main>
    <div class="frame-wrap">
      <iframe id="content" name="content" src="00_教學包總覽_先讀我.html" title="教學包內容"></iframe>
    </div>
  </main>

</div>

<script>
  /* 導覽本身由 <a target="content"> 原生完成（可中鍵開新分頁、可複製連結、
     可鍵盤 Enter）。JS 只負責標示目前檢視中的項目。 */
  const items = document.querySelectorAll('.nitem');
  items.forEach(link => {
    link.addEventListener('click', () => {
      items.forEach(a => a.removeAttribute('aria-current'));
      link.setAttribute('aria-current', 'page');
    });
  });
</script>
</body>
